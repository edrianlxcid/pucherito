<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Una pequeña travesía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@500;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--ink:#e9eef5;--muted:#8d9bb0;--glow:#bcd7f0;--line:rgba(188,215,240,.25)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 30%,#0b1222 0%,#020308 70%);color:var(--ink);overflow:hidden;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;font-family:'Cormorant Garamond',Georgia,serif}
#souls{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ---------- juego ---------- */
#stage{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 1.2s}
#stage.on{opacity:1;pointer-events:auto}
#frame{position:relative;background:#000;box-shadow:0 0 0 1px rgba(188,215,240,.12),0 0 70px rgba(110,160,220,.14);overflow:hidden}
#game{display:block;width:100%;height:100%}
#subs{position:absolute;left:5%;right:5%;bottom:6%;text-align:center;font-style:italic;font-weight:500;
  font-size:clamp(14px,2.5vw,26px);line-height:1.25;color:#f4f7fb;pointer-events:none;
  text-shadow:0 0 3px #000,0 0 10px #000,0 0 18px #000;opacity:0;transition:opacity .4s}
#subs.show{opacity:1}
#subs span{display:block}
#subs .trad{font-size:.72em;font-weight:400;color:#b9c9dc;margin-top:.2em}
#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  pointer-events:none;opacity:0;transition:opacity 1.1s;background:radial-gradient(ellipse at center,rgba(0,0,0,.45),transparent 70%)}
#card.show{opacity:1}
#card .num{font-family:Cinzel,serif;letter-spacing:.55em;font-size:clamp(10px,1.7vw,15px);color:var(--muted);padding-left:.55em}
#card .name{font-family:Cinzel,serif;font-size:clamp(18px,4.4vw,44px);letter-spacing:.1em;color:#f1f5fa;text-shadow:0 0 18px rgba(170,210,255,.55);text-align:center;padding:0 10px}
.orn{width:min(62%,320px);height:16px;display:block}
#keys{font-family:Cinzel,serif;color:var(--muted);font-size:13px;letter-spacing:.12em;margin-top:12px}

/* controles táctiles */
#pad{display:none;width:100%;max-width:520px;justify-content:space-between;align-items:center;padding:18px 22px calc(16px + env(safe-area-inset-bottom))}
body.touch #pad{display:flex}
body.touch #keys{display:none}
body.touch.land #pad{position:fixed;left:0;right:0;bottom:0;max-width:none;padding:10px 20px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
body.touch.land .pb{pointer-events:auto;opacity:.6}
.pad-l{display:flex;gap:14px}
.pb{width:68px;height:68px;border-radius:50%;border:1px solid var(--line);background:rgba(160,200,240,.07);color:var(--glow);
  font-size:24px;display:grid;place-items:center;touch-action:none;font-family:Cinzel,serif}
.pb.down{background:rgba(160,200,240,.3)}
#bJ{width:82px;height:82px;font-size:12px;letter-spacing:.15em}

/* ---------- pantallas (menú y poema) ---------- */
.over{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;padding:44px 22px;overflow-y:auto;
  opacity:0;visibility:hidden;transition:opacity 1.6s,visibility 0s 1.6s}
.over.on{opacity:1;visibility:visible;transition:opacity 1.6s}
.inner{margin:auto;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;max-width:620px;width:100%}
.title{font-family:Cinzel,serif;font-weight:600;font-size:clamp(26px,7.5vw,54px);letter-spacing:.14em;line-height:1.15;
  text-shadow:0 0 26px rgba(170,210,255,.45)}
.sub{font-style:italic;font-size:clamp(18px,4.2vw,24px);color:var(--muted)}
.btn{font-family:Cinzel,serif;letter-spacing:.3em;font-size:15px;color:var(--ink);background:transparent;border:none;
  padding:12px 22px 12px 28px;cursor:pointer;position:relative;text-transform:uppercase;margin-top:8px}
.btn::before,.btn::after{content:'';position:absolute;top:50%;width:18px;height:1px;background:var(--glow);opacity:.6;transition:width .4s}
.btn::before{right:100%}.btn::after{left:100%}
.btn:hover::before,.btn:hover::after{width:36px}
.btn span{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
.small{font-size:16px;color:var(--muted);line-height:1.55}
.ptitle{font-family:Cinzel,serif;font-weight:400;font-size:clamp(19px,5vw,30px);letter-spacing:.12em;line-height:1.3}
.poem{display:flex;flex-direction:column;gap:.6em;margin-top:6px}
.line{font-size:clamp(18px,4.5vw,24px);line-height:1.4;opacity:0;transform:translateY(10px);filter:blur(5px);
  transition:opacity 1.8s,transform 1.8s,filter 1.8s;text-shadow:0 0 14px rgba(170,210,255,.25)}
.line.show{opacity:1;transform:none;filter:none}
.line.em{font-style:italic;color:var(--glow)}
.line.last{font-style:italic;font-size:clamp(20px,5.2vw,28px);color:#fff;text-shadow:0 0 20px rgba(190,220,255,.65);margin-top:.35em}
.sign,.fin{opacity:0;transition:opacity 1.8s;pointer-events:none}
.sign.show,.fin.show{opacity:1;pointer-events:auto}
.sign{font-style:italic;color:var(--muted);margin-top:6px}
.fin{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px}
.msg{font-size:21px;font-style:italic}
/* ---------- hoja de cuaderno ---------- */
.paper-wrap{width:min(94vw,560px);perspective:1800px;margin:6px auto 0}
.paper{position:relative;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transform:rotate(-1.2deg);
  transition:transform 1.3s cubic-bezier(.6,.05,.25,1);cursor:default}
.paper.flipped{transform:rotate(1deg) rotateY(180deg)}
.paper.can-flip{cursor:pointer}
.face{color:#1c1c21;text-align:left;font-family:'Architects Daughter',cursive;letter-spacing:.03em;
  border-radius:3px 12px 5px 16px;padding:32px 24px 30px 28px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,.65),0 0 70px rgba(190,215,245,.10);
  background-color:#ece7dc;
  background-image:
    radial-gradient(ellipse at 88% 10%,rgba(140,110,60,.13),transparent 38%),
    radial-gradient(ellipse at 8% 92%,rgba(120,95,55,.14),transparent 42%),
    radial-gradient(circle at 70% 70%,rgba(255,255,255,.35),transparent 55%),
    linear-gradient(180deg,transparent 48.6%,rgba(0,0,0,.07) 49%,rgba(255,255,255,.35) 49.4%,transparent 50.2%),
    linear-gradient(90deg,transparent 63.5%,rgba(0,0,0,.05) 63.8%,rgba(255,255,255,.3) 64.1%,transparent 64.8%),
    repeating-linear-gradient(0deg,rgba(70,95,140,.2) 0 1px,transparent 1px 22px),
    repeating-linear-gradient(90deg,rgba(70,95,140,.2) 0 1px,transparent 1px 22px)}
.face::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.32;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.face.front{position:relative;text-transform:uppercase}
.face.back{position:absolute;inset:0;transform:rotateY(180deg);display:flex;flex-direction:column;justify-content:center;gap:16px;padding:40px 30px}
.ink{text-shadow:0 0 .6px rgba(20,20,30,.7)}
.ptitle2{font-family:'Architects Daughter',cursive;font-weight:400;font-size:clamp(22px,6vw,32px);line-height:1.2;margin-bottom:4px}
.squig{display:block;width:120px;height:10px;margin:0 0 16px 2px}
.pline{font-size:clamp(13.5px,3.6vw,19px);line-height:1.5;margin:0 0 .4em;
  clip-path:inset(0 100% 0 0);-webkit-clip-path:inset(0 100% 0 0);transition:clip-path 2s ease,-webkit-clip-path 2s ease}
.pline.show{clip-path:inset(0 0 0 0);-webkit-clip-path:inset(0 0 0 0)}
.pline.last{margin-top:.6em}
.doodle{float:right;width:54%;margin:2px -8px 10px 12px;opacity:0;filter:blur(4px);transition:opacity 2.6s,filter 2.6s}
.doodle.show{opacity:1;filter:none}
.doodle svg{display:block;width:100%;height:auto}
.psign{clear:both;text-align:right;font-family:'Caveat',cursive;font-size:clamp(20px,4.6vw,26px);text-transform:none;margin-top:10px;opacity:0;transition:opacity 1.8s}
.psign.show{opacity:1}
.back-text{font-size:clamp(17px,4.4vw,23px);line-height:1.65}
.back-sign{text-align:right;font-family:'Caveat',cursive;font-size:clamp(22px,5vw,28px)}
.back-doodle{width:70px;align-self:center;margin-top:4px}
.creases{position:absolute;inset:0;pointer-events:none;border-radius:inherit;overflow:hidden;opacity:.42}
.creases svg{display:block;width:100%;height:100%}
.paper-wrap.prep{opacity:0}
#poemO.on{transition:opacity .5s}
.btn.easy{margin-top:0;font-size:13px;color:var(--muted)}
#autoBtn{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:6;font-family:Cinzel,serif;font-size:11px;letter-spacing:.14em;
  color:var(--muted);background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:999px;padding:.55em 1.2em;cursor:pointer;
  opacity:0;pointer-events:none;transition:opacity .6s,color .3s,border-color .3s}
#autoBtn.show{opacity:1;pointer-events:auto}
#autoBtn.on{color:#ffe2a6;border-color:rgba(255,210,140,.6);box-shadow:0 0 14px rgba(255,200,120,.25)}
#skip,#mute{position:fixed;z-index:5;font-family:Cinzel,serif;color:var(--muted);background:rgba(0,0,0,.4);
  border:1px solid var(--line);border-radius:999px;cursor:pointer;transition:opacity .5s}
#skip{bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.15em;padding:.6em 1.3em}
#skip.gone{opacity:0;pointer-events:none}
#mute{top:12px;right:12px;width:38px;height:38px;font-size:15px}
#mute.off{opacity:.4;text-decoration:line-through}
</style>
</head>
<body>
<canvas id="souls"></canvas>

<!-- MENÚ -->
<div class="over on" id="menu">
  <div class="inner">
    <svg class="orn" viewBox="0 0 320 16"><use href="#ornament"/></svg>
    <h1 class="title">Una Pequeña<br>Travesía</h1>
    <svg class="orn" viewBox="0 0 320 16" style="transform:scaleY(-1)"><use href="#ornament"/></svg>
    <p class="sub" id="menuSub"></p>
    <button class="btn" id="startBtn"><span>Comenzar</span></button>
    <button class="btn easy" id="easyBtn"><span>Modo fácil</span></button>
    <p class="small" style="margin-top:-12px;font-size:14px">(el errante camina solo hasta el final)</p>
    <p class="small" id="howto"></p>
  </div>
</div>

<!-- JUEGO -->
<div id="stage">
  <div id="frame">
    <canvas id="game"></canvas>
    <div id="subs"></div>
    <div id="card">
      <div class="num"></div>
      <svg class="orn" viewBox="0 0 320 16"><use href="#ornament"/></svg>
      <div class="name"></div>
      <svg class="orn" viewBox="0 0 320 16" style="transform:scaleY(-1)"><use href="#ornament"/></svg>
    </div>
  </div>
  <p id="keys">← → moverse · espacio saltar</p>
  <div id="pad">
    <div class="pad-l">
      <div class="pb" data-k="left">◀</div>
      <div class="pb" data-k="right">▶</div>
    </div>
    <div class="pb" id="bJ" data-k="jump">SALTAR</div>
  </div>
</div>

<!-- POEMA -->
<div class="over" id="poemO">
  <div class="inner">
    <div class="paper-wrap">
      <div class="paper" id="paper">
        <!-- FRENTE: el poema -->
        <div class="face front ink">
          <h2 class="ptitle2" id="ptitle"></h2>
          <svg class="squig" viewBox="0 0 120 10"><path d="M2 6 C14 1 22 9 34 5 S56 2 68 6 S92 9 118 4" fill="none" stroke="#1c1c21" stroke-width="1.8" stroke-linecap="round"/></svg>
          <div id="poem"></div>
          <p class="psign" id="sign"></p>
        </div>
        <!-- REVERSO: tu mensaje -->
        <div class="face back ink">
          <p class="back-text" id="reverso"></p>
          <p class="back-sign" id="reversoFirma"></p>
          <svg class="back-doodle" viewBox="0 0 60 70" fill="none" stroke="#1c1c21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16 Q30 4 38 16"/><path d="M18 16 H42 L38 24 H22 Z"/>
            <rect x="20" y="24" width="20" height="28" rx="3"/><path d="M27 24 V52 M33 24 V52"/>
            <path d="M30 44 C24 39 23 34 27 32 C29 31 30 33 30 34 C30 33 31 31 33 32 C37 34 36 39 30 44 Z" fill="#1c1c21"/>
            <path d="M16 56 H44"/><path d="M8 30 L3 28 M52 30 L57 28 M10 42 L4 44 M50 42 L56 44"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- dibujo a tinta (se coloca dentro del poema) -->
    <figure class="doodle" id="doodle">
      <svg viewBox="0 0 300 340" aria-label="dibujo a tinta de dos errantes junto a un farol">
        <defs>
          <pattern id="gA" width="34" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)"><path d="M-2 4 Q8.5 0 17 4 T36 4" fill="none" stroke="#1c1c21" stroke-width="1.15"/></pattern>
          <pattern id="gB" width="30" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(26)"><path d="M-2 4 Q7.5 .5 15 4 T32 4" fill="none" stroke="#1c1c21" stroke-width="1.15"/></pattern>
          <pattern id="gG" width="48" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-4)"><path d="M-2 3.5 Q12 0 24 3.5 T50 3.5" fill="none" stroke="#1c1c21" stroke-width="1"/></pattern>
          <filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter>
          <path id="dCave" d="M0 0 L300 0 L300 18 L272 20 L263 50 L254 19 L222 15 L213 38 L204 14 L152 17 L141 31 L132 13 L92 12 L83 42 L74 12 L32 15 L23 35 L14 14 L0 17 Z"/>
          <path id="dRock" d="M4 302 C60 287 120 293 170 289 S262 285 298 295 L298 338 L4 338 Z"/>
          <path id="dCloakA" d="M80 196 C62 222 52 258 50 290 L62 283 L74 292 L86 284 L98 293 L110 284 L122 292 L134 284 L146 291 C144 256 136 222 122 196 Z"/>
          <path id="dCloakB" d="M180 210 C164 234 158 262 156 292 L168 285 L180 293 L192 285 L204 293 L216 285 L228 292 L240 286 L248 292 C246 262 236 232 220 210 Z"/>
          <path id="dArm" d="M124 226 C144 214 170 211 194 222 C190 229 172 225 152 229 C140 231 131 234 124 236 Z"/>
          <path id="dTip" d="M94 144 C78 118 52 114 38 126 C52 126 66 136 82 158 Z"/>
          <ellipse id="dHeadA" cx="108" cy="162" rx="37" ry="34" transform="rotate(14 108 162)"/>
          <ellipse id="dHeadB" cx="188" cy="180" rx="34" ry="32" transform="rotate(-16 188 180)"/>
        </defs>
        <g filter="url(#wob)" stroke="#1c1c21" stroke-linejoin="round" stroke-linecap="round">
          <use href="#dCave" fill="#ece7dc"/><use href="#dCave" fill="url(#gG)" stroke-width="2"/>
          <use href="#dRock" fill="#ece7dc"/><use href="#dRock" fill="url(#gG)" stroke-width="2.2"/>
          <use href="#dCloakA" fill="#ece7dc"/><use href="#dCloakA" fill="url(#gA)" stroke-width="2.3"/>
          <use href="#dCloakB" fill="#ece7dc"/><use href="#dCloakB" fill="url(#gB)" stroke-width="2.3"/>
          <use href="#dArm" fill="#ece7dc"/><use href="#dArm" fill="url(#gA)" stroke-width="2.1"/>
          <use href="#dTip" fill="#ece7dc"/><use href="#dTip" fill="url(#gB)" stroke-width="2.2"/>
          <use href="#dHeadA" fill="#ece7dc"/><use href="#dHeadA" fill="url(#gB)" stroke-width="2.4"/>
          <!-- carita A -->
          <ellipse cx="121" cy="170" rx="21" ry="18" transform="rotate(14 121 170)" fill="#ece7dc" stroke-width="1.9"/>
          <path d="M107 169 q6 6 12 0" fill="none" stroke-width="2.6"/>
          <path d="M123 165 q6 6 12 0" fill="none" stroke-width="2.6"/>
          <!-- antenas B -->
          <path d="M176 152 C166 128 174 110 190 108" fill="none" stroke-width="2.2"/><circle cx="192" cy="108" r="3.6" fill="#1c1c21"/>
          <path d="M198 150 C202 126 216 116 232 120" fill="none" stroke-width="2.2"/><circle cx="234" cy="121" r="3.6" fill="#1c1c21"/>
          <use href="#dHeadB" fill="#ece7dc"/><use href="#dHeadB" fill="url(#gA)" stroke-width="2.4"/>
          <!-- carita B -->
          <ellipse cx="174" cy="188" rx="19" ry="16" transform="rotate(-16 174 188)" fill="#ece7dc" stroke-width="1.9"/>
          <path d="M162 187 q5.5 6 11 0" fill="none" stroke-width="2.6"/>
          <path d="M176 191 q5.5 6 11 0" fill="none" stroke-width="2.6"/>
          <!-- farol -->
          <g stroke-width="2" transform="translate(150 291) scale(1.3) translate(-150 -291)">
            <path d="M143 254 Q150 241 157 254" fill="none"/>
            <path d="M137 262 L163 262 L157 254 L143 254 Z" fill="#1c1c21"/>
            <rect x="140" y="262" width="20" height="27" rx="3" fill="#ece7dc"/>
            <path d="M146.5 262 V289 M153.5 262 V289" stroke-width="1.2"/>
            <path d="M150 267 C145 275 146 282 150 284 C154 282 155 275 150 267 Z" fill="#ece7dc"/>
            <path d="M136 291 H164" stroke-width="2.6"/>
            <path d="M126 272 L118 270 M174 272 L182 270 M129 284 L121 287 M171 284 L179 287 M150 243 L150 236" stroke-width="1.4"/>
          </g>
          <!-- luciérnagas -->
          <g fill="#1c1c21" stroke-width="1.1">
            <circle cx="44" cy="74" r="2.6"/><path d="M44 66 V69 M44 79 V82 M36 74 H39 M49 74 H52"/>
            <circle cx="246" cy="78" r="2.4"/><path d="M246 71 V73.5 M246 82.5 V85 M239 78 H241.5 M250.5 78 H253"/>
            <circle cx="272" cy="150" r="2"/><circle cx="28" cy="206" r="2"/><circle cx="214" cy="58" r="1.8"/><circle cx="72" cy="112" r="1.6"/>
          </g>
        </g>
      </svg>
    </figure>

    <div class="fin" id="fin">
      <button class="btn" id="flipBtn"><span>Voltear la hoja</span></button>
      <p class="msg" id="msg"></p>
      <button class="btn" id="again"><span>Jugar otra vez</span></button>
    </div>
  </div>
</div>
<button id="skip" class="gone">mostrar todo</button>
<button id="mute" title="Sonido">♪</button>
<button id="autoBtn">✦ modo fácil</button>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="ornament" fill="none" stroke="#bcd7f0">
      <path d="M8 8 H128" stroke-opacity=".45"/><path d="M192 8 H312" stroke-opacity=".45"/>
      <path d="M128 8 Q138 1 146 8 Q138 15 128 8" stroke-opacity=".7"/>
      <path d="M192 8 Q182 1 174 8 Q182 15 192 8" stroke-opacity=".7"/>
      <path d="M160 1.5 L166.5 8 L160 14.5 L153.5 8 Z"/>
      <circle cx="160" cy="8" r="1.6" fill="#bcd7f0" stroke="none"/>
      <circle cx="4" cy="8" r="1.4" fill="#bcd7f0" stroke="none" opacity=".6"/>
      <circle cx="316" cy="8" r="1.4" fill="#bcd7f0" stroke="none" opacity=".6"/>
    </g>
  </defs>
</svg>

<script>
/* =====================================================
   PERSONALIZA AQUÍ
   (también sirve el enlace:  index.html?para=Ana&de=Adrian )
   ===================================================== */
const CONFIG = {
  para: "Madeline ♡ ",                            // nombre de ella
  de: "Adri",                                      // tu nombre
  titulo: "Quererte",       // título sobre el poema
  mensaje: "Gracias por estar aqui c:.",   // mensaje al final
  autor: "Anónimo",
  reverso: "Made no sabes lo mucho que significas para mi ahora, te quiero tanto, tus ojitos tienen mi vida entera, te quiero muchisimo, nunca cambies, me encantas como eres, haces que mis dias sean mas tranquilos, me motivas ♡ c:",
  cancion: "And I Love Her (Remastered 2009).mp3",
  volumen: 0.85,
  desfaseSubtitulos: 0,  // si la letra sale TARDE pon un número positivo (ej. 0.4); si sale ANTES, negativo
  letraEnLinea: true,    // si subtitulos.js está vacío, busca la letra sola en lrclib.net
  traducir: true,        // muestra la traducción entre paréntesis debajo de cada línea
  idiomas: "en|es",      // de inglés a español
  artista: "The Beatles",
  tema: "And I Love Her"
};

const POEMA = [
  "No quiero que te enamores de mí.",
  "Quiero que te enamores de ti.",
  "Quiero que aprendas a amarte incondicionalmente.",
  "No quiero que seas mía. Quiero que seas tuya.",
  "Quiero que reconozcas tu grandeza.",
  "Quiero que regreses a ti.",
  "Quiero que seas capaz de amar con mi presencia o sin mi presencia.",
  "No quiero nada de ti. Quiero todo de mí.",

function parseLRC(txt){
  const out = [];
  (txt || '').split(/\r?\n/).forEach(line => {
    const tags = [...line.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)];
    if (!tags.length) return;
    const text = line.replace(/\[[^\]]*\]/g, '').trim();
    tags.forEach(m => out.push({ t: +m[1]*60 + parseFloat(m[2].replace(':','.')), text }));
  });
  return out.sort((a,b) => a.t - b.t);
}

let buscandoLetra = false;
async function cargarLetraEnLinea(){
  if (LYRICS.length || !CONFIG.letraEnLinea || buscandoLetra) return;
  buscandoLetra = true;
  try {
    const r = await fetch('https://lrclib.net/api/search?artist_name=' + encodeURIComponent(CONFIG.artista) + '&track_name=' + encodeURIComponent(CONFIG.tema));
    if (!r.ok) return;
    const dur = song.duration || 149.7;
    const best = (await r.json()).filter(x => x.syncedLyrics)
      .sort((a,b) => Math.abs(a.duration - dur) - Math.abs(b.duration - dur))[0];
    if (best){ LYRICS = parseLRC(best.syncedLyrics); traducirLetra(); }
  } catch (e) { /* sin internet: el juego sigue sin subtítulos */ }
  finally { buscandoLetra = false; }
}

   1) Usa primero las traducciones que pongas en subtitulos.js (window.TRADUCCION)

      y se guardan en el navegador para no volver a pedirlas. */
const TRAD = {};
const normal = s => s.trim().toLowerCase().replace(/\s+/g, ' ');
Object.entries(window.TRADUCCION || {}).forEach(([k,v]) => { if (v) TRAD[normal(k)] = v; });

const [idiomaDe, idiomaA] = CONFIG.idiomas.split('|');
async function traducirGoogle(s){
  try {
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=' + idiomaDe + '&tl=' + idiomaA + '&q=' + encodeURIComponent(s));
    const j = await r.json(); return j[0].map(x => x[0]).join('');
  } catch (e) { return ''; }
}
async function traducirMyMemory(s){
  try {
    const r = await fetch('https://api.mymemory.translated.net/get?langpair=' + CONFIG.idiomas + '&q=' + encodeURIComponent(s));
    const j = await r.json(), t = j && j.responseData && j.responseData.translatedText;
    return (+j.responseStatus === 200 && t && !/MYMEMORY WARNING|QUERY LENGTH/i.test(t)) ? t : '';
  } catch (e) { return ''; }
}
async function traducirLetra(){
  if (!CONFIG.traducir) return;
  const pendientes = [...new Set(LYRICS.map(l => l.text).filter(Boolean))].filter(s => !TRAD[normal(s)]);
  pendientes.forEach(s => { if (tradCache[normal(s)]) TRAD[normal(s)] = tradCache[normal(s)]; });
  const cola = pendientes.filter(s => !TRAD[normal(s)]);
  const trabajador = async () => {
    while (cola.length){
      const s = cola.shift();
      const t = await traducirGoogle(s) || await traducirMyMemory(s);
      if (t){ const bonito = t.trim().replace(/[.。]+$/, '').replace(/^./, c => c.toUpperCase()); TRAD[normal(s)] = bonito; tradCache[normal(s)] = bonito; }
    }
  };
  await Promise.all([trabajador(), trabajador(), trabajador()]);
  try { localStorage.setItem('traduccion_cache_v2', JSON.stringify(tradCache)); } catch (e) {}
}

function buildLevel(def){
  const w = def.w, g = [...Array(H)].map(() => new Uint8Array(w));
  const L = { w, g, orbs:[], checks:[], movers:[], fallers:[], signs:[], deco:[], start:null, exit:null };
  const b = {
    fill(x,y,ww,hh,t=1){ for (let j=y;j<y+hh;j++) for (let i=x;i<x+ww;i++) if (i>=0&&i<w&&j>=0&&j<H) g[j][i] = t; },
    ground(x1,x2,top){ b.fill(x1,top,x2-x1+1,H-top); },
    spikes(x1,x2,row){ b.fill(x1,row,x2-x1+1,1,2); },
    orb(x,y){ L.orbs.push({ x:x*T+T/2, y:y*T+T/2, got:false, ph:Math.random()*6 }); },
    check(x,y){ L.checks.push({ x:x*T+T/2, y:(y+1)*T, on:false }); },
    mover(x0,x1,row,wt=3,v=45){ L.movers.push({ x:x0*T, y:row*T, w:wt*T, h:7, x0:x0*T, x1:x1*T, v, dx:0 }); },
    faller(x,row,wt=2){ L.fallers.push({ x:x*T, y:row*T, y0:row*T, w:wt*T, h:7, state:0, t:0, vy:0, dx:0 }); },
    start(x,y){ L.start = { x:x*T+4, y:(y+1)*T-18 }; },
    exit(x,y){ L.exit = { x:x*T+T/2, y:(y+1)*T }; },
    sign(x,y,txt){ L.signs.push({ x:x*T, y:y*T, txt }); }
  };
  def.build(b);
  // decoración automática sobre el suelo
  const r = rng(def.seed);
  for (let i=1;i<w-1;i++){
    if (Math.abs(i*T - L.start.x) < 60 || Math.abs(i*T - L.exit.x) < 50) continue;
    for (let j=1;j<H;j++){
      if (g[j][i]===1 && g[j-1][i]===0){
        if (r() < (def.type==='city' ? .07 : .17)) L.deco.push({ x:i*T + r()*T, y:j*T, type:def.type, s:r() });
        break;
      }
    }
  }
  return L;
}

      x.beginPath(); x.moveTo(0,VH); for (let X=0; X<=w; X+=12) x.lineTo(X, VH-28-Math.sin(X*.02)*14-r()*8); x.lineTo(w,VH); x.fill();
    } else if (def.type === 'garden'){
      x.strokeStyle = p.mid; x.lineWidth = 2;
      for (let X=0; X<w; X += 20 + r()*40){ const ll = 20 + r()*80; x.beginPath(); x.moveTo(X,0); x.quadraticCurveTo(X+6,ll/2,X,ll); x.stroke(); }
      for (let X=0; X<w; X += 70 + r()*90){ const sh = 40 + r()*50, cw = 26 + r()*24; x.fillRect(X-3,VH-sh,6,sh); x.beginPath(); x.ellipse(X,VH-sh,cw/2,10,0,Math.PI,0); x.fill(); }

/* ---------- nivel pre-dibujado ---------- */
function prerenderLevel(L, def){
  const p = def.pal, [c, x] = offscreen(L.w*T, VH), r = rng(def.seed*3);
  const tileAtL = (i,j) => (i<0||i>=L.w) ? 1 : (j<0||j>=H) ? 0 : L.g[j][i];
  for (let i=0;i<L.w;i++){
    let depth = 0;
    for (let j=0;j<H;j++){
      const t = L.g[j][i];
      if (t === 1){
        depth = (j>0 && L.g[j-1][i]===1) ? depth+1 : 0;
        x.fillStyle = p.tile; x.fillRect(i*T, j*T, T+.5, T+.5);
        x.fillStyle = p.dark;
        if (hash(i,j) > .45) x.fillRect(i*T + (hash(j,i)*14|0), j*T + (hash(i+7,j)*14|0), 4, 3);
        if (hash(i+3,j) > .7) x.fillRect(i*T + (hash(j+5,i)*16|0), j*T + (hash(i,j+9)*16|0), 2, 2);
        x.fillStyle = `rgba(0,0,0,${Math.min(.55, depth*.13)})`; x.fillRect(i*T, j*T, T+.5, T+.5);
        x.fillStyle = p.rim;
        if (tileAtL(i,j-1) !== 1){
          x.globalAlpha = .9; x.fillRect(i*T, j*T, T, 1.3);
          x.globalAlpha = .18; x.fillRect(i*T, j*T+1.3, T, 3.5);
          x.globalAlpha = .7;
          if (def.type === 'garden') for (let k=0;k<3;k++){ const gx = i*T + hash(i,k)*T; x.fillRect(gx, j*T-2-hash(k,i)*3, .9, 3+hash(k,i)*3); }
          if (def.type === 'cave' && hash(i,j+1) > .6){ x.fillRect(i*T + hash(i,2)*T, j*T-1.5, 1.4, 1.5); }
        }
        x.globalAlpha = .3;
        if (tileAtL(i-1,j) === 0 || tileAtL(i-1,j) === 2) x.fillRect(i*T, j*T, 1, T);
        if (tileAtL(i+1,j) === 0 || tileAtL(i+1,j) === 2) x.fillRect(i*T+T-1, j*T, 1, T);
        x.globalAlpha = .15;
        if (j < H-1 && tileAtL(i,j+1) === 0) x.fillRect(i*T, j*T+T-1, T, 1);
        x.globalAlpha = 1;
        // estalactitas / enredaderas bajo el techo
        if (j === 0 && tileAtL(i,1) === 0){
          if (def.type === 'cave' && r() < .5){ const ww = 4 + r()*10, ll = 5 + r()*16, sx = i*T + r()*8; x.fillStyle = p.tile; x.beginPath(); x.moveTo(sx,T); x.lineTo(sx+ww,T); x.lineTo(sx+ww/2,T+ll); x.fill(); }
          if (def.type === 'garden' && r() < .6){ const ll = 8 + r()*40, sx = i*T + r()*T; x.strokeStyle = 'rgba(134,220,174,.35)'; x.lineWidth = .8; x.beginPath(); x.moveTo(sx,T); x.quadraticCurveTo(sx+3,T+ll/2,sx,T+ll); x.stroke(); x.fillStyle = 'rgba(151,245,198,.45)'; x.beginPath(); x.arc(sx,T+ll,1.3,0,7); x.fill(); }
        }
      } else if (t === 2){
        depth = 0;
        const by = (j+1)*T;
        x.fillStyle = '#cfd8e4'; x.strokeStyle = 'rgba(0,0,0,.6)'; x.lineWidth = .6;
        for (let k=0;k<3;k++){ const sx = i*T + k*T/3; x.beginPath(); x.moveTo(sx+.5,by); x.lineTo(sx+T/6,by-10-hash(i,k)*3); x.lineTo(sx+T/3-.5,by); x.closePath(); x.fill(); x.stroke(); }
      } else depth = 0;
    }
  }
  return c;
}

/* ---------- estado ---------- */
let state = 'menu', phase = 0, L = null, LPX = 0, layers = null, levelC = null, PAL = null;
let camX = 0, fade = 1, fadeTo = 0, time = 0, deadT = 0, lockT = 0, exitT = 0, got = 0, lastCam = 0;
let respawn = { x:0, y:0 }, parts = [], motes = [], rain = [];
const P = { x:0, y:0, w:12, h:18, vx:0, vy:0, face:1, ground:false, coyote:0, buf:0, anim:0, dead:false, on:null, alpha:1, lantern:{x:0,y:0} };
const keys = { left:false, right:false, jump:false }; let jumpPressed = false;

function loadPhase(i){
  phase = i; const def = PHASES[i]; PAL = def.pal;
  L = buildLevel(def); LPX = L.w*T;
  levelC = prerenderLevel(L, def); layers = buildBackgrounds(def);
  Object.assign(P, { x:L.start.x, y:L.start.y, vx:0, vy:0, face:1, dead:false, on:null, alpha:1, ground:false });
  respawn = { x:L.start.x, y:L.start.y }; got = 0; parts = [];
  camX = clamp(P.x - VW/3, 0, LPX - VW); lastCam = camX;
  motes = Array.from({length:38}, () => ({ x:rnd(0,VW), y:rnd(0,VH), v:rnd(4,12), r:rnd(.4,1.3), ph:rnd(0,6) }));
  rain = def.type === 'city' ? Array.from({length:120}, () => ({ x:rnd(0,VW+40), y:rnd(-VH,VH), v:rnd(320,420), l:rnd(6,12) })) : [];
  fade = 1; fadeTo = 0; lockT = 1.4; state = 'play';
  const card = $('#card'); card.querySelector('.num').textContent = 'FASE ' + def.num; card.querySelector('.name').textContent = def.name;
  card.classList.add('show'); setTimeout(() => card.classList.remove('show'), 3000);
}

/* ---------- colisiones ---------- */
const tileAt = (i,j) => (i<0||i>=L.w) ? 1 : (j<0||j>=H) ? 0 : L.g[j][i];
function eachSolid(cb){
  const x0 = Math.floor(P.x/T), x1 = Math.floor((P.x+P.w-.001)/T), y0 = Math.floor(P.y/T), y1 = Math.floor((P.y+P.h-.001)/T);
  for (let j=y0;j<=y1;j++) for (let i=x0;i<=x1;i++) if (tileAt(i,j) === 1) cb(i,j);
}
function moveX(dx){
  P.x += dx;
  eachSolid(i => { if (dx > 0) P.x = Math.min(P.x, i*T - P.w); else if (dx < 0) P.x = Math.max(P.x, (i+1)*T); P.vx = 0; });
}
function moveY(dy){
  const prevBottom = P.y + P.h;
  P.y += dy; P.ground = false; P.on = null;
  eachSolid((i,j) => { if (dy > 0){ P.y = Math.min(P.y, j*T - P.h); P.ground = true; } else if (dy < 0) P.y = Math.max(P.y, (j+1)*T); P.vy = 0; });
  if (dy >= 0){
    for (const p of L.movers.concat(L.fallers.filter(f => f.state < 3))){
      if (P.x+P.w > p.x+1 && P.x < p.x+p.w-1 && prevBottom <= p.y + .5 && P.y+P.h >= p.y){
        P.y = p.y - P.h; P.vy = 0; P.ground = true; P.on = p;
      }
    }
  }
}
function die(){
  if (P.dead) return;
  P.dead = true; deadT = 0; sfx.die();
  for (let k=0;k<26;k++) parts.push({ x:P.x+P.w/2, y:P.y+P.h/2, vx:rnd(-90,90), vy:rnd(-120,30), life:rnd(.5,1.1), max:1.1, r:rnd(.6,1.8), c:'230,240,255' });
}
function doRespawn(){
  Object.assign(P, { x:respawn.x, y:respawn.y, vx:0, vy:0, dead:false, on:null });
  L.fallers.forEach(f => Object.assign(f, { state:0, y:f.y0, vy:0, t:0 }));
  fade = .7; fadeTo = 0;
}

/* ---------- actualización ---------- */
function step(dt){
  time += dt; lockT -= dt;
  for (const m of L.movers){ const ox = m.x; m.x += m.v*dt; if (m.x > m.x1){ m.x = m.x1; m.v *= -1; } if (m.x < m.x0){ m.x = m.x0; m.v *= -1; } m.dx = m.x - ox; }
  for (const f of L.fallers){
    if (f.state === 1){ f.t += dt; if (f.t > .5){ f.state = 2; f.vy = 0; } }
    else if (f.state === 2){ f.vy += G*.6*dt; f.y += f.vy*dt; if (f.y > VH + 40){ f.state = 3; f.t = 0; } }
    else if (f.state === 3){ f.t += dt; if (f.t > 2.5){ f.state = 0; f.y = f.y0; f.t = 0; } }
  }
  for (const q of parts){ q.x += q.vx*dt; q.y += q.vy*dt; q.vy += 60*dt; q.life -= dt; }
  parts = parts.filter(q => q.life > 0);

  if (P.dead){ deadT += dt; if (deadT > 1) doRespawn(); return; }

  let dir = 0;
  const canInput = state === 'play' && lockT <= 0;
  if (state === 'exiting'){ const d = L.exit.x - (P.x + P.w/2); dir = Math.abs(d) > 2 ? Math.sign(d) : 0; }
  else if (canInput) dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const acc = P.ground ? 1500 : 1000;
  P.vx += clamp(dir*RUN - P.vx, -acc*dt, acc*dt);
  if (dir) P.face = dir;
  P.coyote = P.ground ? COYOTE : P.coyote - dt;
  if (jumpPressed && canInput){ P.buf = .13; } else P.buf -= dt;
  jumpPressed = false;
  if (P.buf > 0 && P.coyote > 0){
    P.vy = -JUMP; P.buf = 0; P.coyote = 0; P.ground = false; sfx.jump();
    for (let k=0;k<5;k++) parts.push({ x:P.x+P.w/2, y:P.y+P.h, vx:rnd(-30,30), vy:rnd(-20,0), life:.4, max:.4, r:.8, c:PAL.mote });
  }
  const g = (P.vy < 0 && !keys.jump) ? G*2.2 : G;
  P.vy = Math.min(P.vy + g*dt, 560);
  const carry = P.on ? P.on.dx : 0;
  moveX(P.vx*dt + carry);
  moveY(P.vy*dt);
  if (P.on && P.on.state === 0 && L.fallers.includes(P.on)){ P.on.state = 1; P.on.t = 0; }
  if (Math.abs(P.vx) > 15) P.anim += dt;

  // espinas y caídas
  const x0 = Math.floor((P.x+2)/T), x1 = Math.floor((P.x+P.w-2)/T), y0 = Math.floor((P.y+4)/T), y1 = Math.floor((P.y+P.h-1)/T);
  for (let j=y0;j<=y1;j++) for (let i=x0;i<=x1;i++) if (tileAt(i,j) === 2 && P.y + P.h - 1 > j*T + T*.45) die();
  if (P.y > VH + 30) die();
  if (P.dead) return;

  const cx = P.x + P.w/2, cy = P.y + P.h/2;
  for (const o of L.orbs) if (!o.got && Math.hypot(o.x-cx, o.y-cy) < 14){
    o.got = true; got++; sfx.orb();
    for (let k=0;k<12;k++) parts.push({ x:o.x, y:o.y, vx:rnd(-50,50), vy:rnd(-60,20), life:rnd(.4,.8), max:.8, r:rnd(.5,1.2), c:PAL.mote });
  }
  for (const c of L.checks) if (!c.on && Math.abs(c.x-cx) < 14 && Math.abs(c.y - (P.y+P.h)) < 24){
    c.on = true; respawn = { x:c.x-6, y:c.y-18 }; sfx.check();
  }
  if (state === 'play' && Math.abs(L.exit.x - cx) < 12 && Math.abs(L.exit.y - (P.y+P.h)) < 30){
    state = 'exiting'; exitT = 0; sfx.win();
  }
  if (state === 'exiting'){
    exitT += dt; P.alpha = clamp(1 - (exitT-.6)/.8, 0, 1);
    if (exitT > 1.2) fadeTo = 1;
    if (exitT > 2.4){ if (phase < PHASES.length-1) loadPhase(phase+1); else toPoem(); }
  }
}

/* ---------- dibujo ---------- */
function glow(x, y, r, col, a){
  const g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.fillRect(x-r, y-r, r*2, r*2);
}
const rgbOf = hex => { const n = parseInt(hex.slice(1),16); return `${n>>16&255},${n>>8&255},${n&255}`; };

function drawPlayer(){
  if (P.dead) return;
  const cx = P.x + P.w/2 - camX, fy = P.y + P.h, moving = Math.abs(P.vx) > 15, t = P.anim;
  const rim = `rgba(${rgbOf(PAL.rim)},.6)`;
  ctx.save(); ctx.globalAlpha = P.alpha; ctx.translate(cx, fy); ctx.scale(P.face, 1);
  const bob = P.ground && moving ? -Math.abs(Math.sin(t*12))*1.2 : 0;
  // piernas
  ctx.strokeStyle = '#04050a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  const sw = P.ground && moving ? Math.sin(t*12)*3 : (P.ground ? 0 : 1.5);
  ctx.beginPath(); ctx.moveTo(-2,-5); ctx.lineTo(-2+sw,-.9); ctx.moveTo(2,-5); ctx.lineTo(2-sw,-.9); ctx.stroke();
  // capa
  const tr = (moving ? 2.5 : 0) + Math.sin(time*5)*.6;
  const lift = P.ground ? 0 : clamp(P.vy/200, -2, 2);
  ctx.fillStyle = '#0a0c15'; ctx.strokeStyle = rim; ctx.lineWidth = .7;
  ctx.beginPath();
  ctx.moveTo(-3.5,-13+bob);
  ctx.quadraticCurveTo(-6-tr,-8+bob,-7-tr,-3.5+lift);
  ctx.lineTo(-4.6-tr*.6,-2.3+lift); ctx.lineTo(-2.5-tr*.3,-3.7+lift); ctx.lineTo(-.5,-2.3); ctx.lineTo(1.5,-3.7); ctx.lineTo(3.5,-2.3); ctx.lineTo(5.5,-3.6);
  ctx.quadraticCurveTo(5.6,-9+bob,3.5,-13+bob); ctx.closePath(); ctx.fill(); ctx.stroke();
  // capucha
  ctx.beginPath(); ctx.arc(.5,-16.6+bob,5.2,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-2.6,-20.6+bob);
  ctx.quadraticCurveTo(-6,-24.5+bob,-9.5,-22.4+bob+Math.sin(time*4)*.7);
  ctx.quadraticCurveTo(-6,-21+bob,-4.4,-18.4+bob); ctx.closePath(); ctx.fill(); ctx.stroke();
  // ojos
  const blink = (time % 4.3) < .12 ? .15 : 1;
  ctx.fillStyle = '#fff1c4'; ctx.shadowColor = '#ffe3a0'; ctx.shadowBlur = 4*R;
  ctx.beginPath(); ctx.ellipse(1.8,-16.7+bob,1,1.5*blink,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(4.3,-16.7+bob,.9,1.4*blink,0,0,7); ctx.fill();
  // farolito
  const sway = Math.sin(time*3 + t*4) * (moving ? 1.6 : 1);
  ctx.shadowBlur = 0; ctx.strokeStyle = '#3a3a48'; ctx.lineWidth = .8;
  ctx.beginPath(); ctx.moveTo(4.5,-10+bob); ctx.lineTo(8,-9.5+bob); ctx.lineTo(8+sway,-6.8+bob); ctx.stroke();
  ctx.fillStyle = '#ffd38a'; ctx.shadowColor = '#ffb24d'; ctx.shadowBlur = 8*R;
  ctx.fillRect(6.6+sway,-6.8+bob,3,3.7);
  ctx.restore();
  P.lantern = { x: P.x + P.w/2 + P.face*(8+sway), y: fy - 5 + bob };
}

function render(){
  const p = PAL, mote = p.mote, acc = rgbOf(p.acc);
  ctx.setTransform(R,0,0,R,0,0);
  const sky = ctx.createLinearGradient(0,0,0,VH); sky.addColorStop(0,p.sky0); sky.addColorStop(1,p.sky1);
  ctx.fillStyle = sky; ctx.fillRect(0,0,VW,VH);
  for (const l of layers) ctx.drawImage(l.c, Math.round(camX*l.f*R), 0, VW*R, VH*R, 0, 0, VW, VH);
  const fog = ctx.createLinearGradient(0,VH-80,0,VH); fog.addColorStop(0,`rgba(${mote},0)`); fog.addColorStop(1,`rgba(${mote},.1)`);
  ctx.fillStyle = fog; ctx.fillRect(0,VH-80,VW,80);
  ctx.drawImage(levelC, Math.round(camX*R), 0, VW*R, VH*R, 0, 0, VW, VH);

  const lights = [];
  const vis = x => x - camX > -80 && x - camX < VW + 80;
  // decoración
  for (const d of L.deco){
    if (!vis(d.x)) continue; const x = d.x - camX, y = d.y;
    if (d.type === 'cave'){
      ctx.fillStyle = `rgba(${acc},.55)`; ctx.strokeStyle = `rgba(${acc},.9)`; ctx.lineWidth = .6;
      const hgt = 6 + d.s*7;
      [[-2.5,.7],[0,1],[2.6,.6]].forEach(([o,k]) => { ctx.beginPath(); ctx.moveTo(x+o-1.6,y); ctx.lineTo(x+o+(o*.3),y-hgt*k); ctx.lineTo(x+o+1.6,y); ctx.closePath(); ctx.fill(); ctx.stroke(); });
      lights.push({ x:d.x, y:y-4, r:24, a:.7 });
    } else if (d.type === 'garden'){
      const hgt = 5 + d.s*7, cw = 5 + d.s*5;
      ctx.strokeStyle = 'rgba(200,240,220,.5)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.sin(time+d.s*6)*.6,y-hgt); ctx.stroke();
      ctx.fillStyle = `rgba(${acc},.8)`; ctx.beginPath(); ctx.ellipse(x,y-hgt,cw/2,cw/3,0,Math.PI,0); ctx.fill();
      glow(x, y-hgt, 10, acc, .25 + .1*Math.sin(time*2+d.s*9));
      lights.push({ x:d.x, y:y-hgt, r:28, a:.75 });
    } else {
      ctx.fillStyle = '#0c0b1c'; ctx.fillRect(x-1,y-26,2,26); ctx.fillRect(x-3,y-27,6,2);
      ctx.fillStyle = '#e8ebff'; ctx.fillRect(x-1.6,y-25,3.2,3.6);
      glow(x, y-23, 14, '220,225,255', .35);
      lights.push({ x:d.x, y:y-23, r:48, a:.8 });
    }
  }
  // carteles
  ctx.font = '500 8px Cinzel, serif'; ctx.textAlign = 'left';
  for (const s of L.signs) if (vis(s.x)){ ctx.fillStyle = 'rgba(225,233,245,.6)'; ctx.fillText(s.txt, s.x - camX, s.y); }
  // linternas de control
  for (const c of L.checks){
    if (!vis(c.x)) continue; const x = c.x - camX;
    ctx.fillStyle = '#05060c'; ctx.fillRect(x-.8, c.y-24, 1.6, 24); ctx.fillRect(x-3, c.y-2, 6, 2);
    ctx.fillStyle = c.on ? '#ffd38a' : '#3d4152'; ctx.fillRect(x-2.2, c.y-28, 4.4, 5);
    if (c.on){ glow(x, c.y-26, 16, '255,200,120', .4); lights.push({ x:c.x, y:c.y-26, r:60, a:.9 }); }
    else lights.push({ x:c.x, y:c.y-26, r:16, a:.4 });
  }
  // salida
  { const e = L.exit, x = e.x - camX, y = e.y, pulse = .5 + .5*Math.sin(time*2);
    const gg = ctx.createRadialGradient(x,y-18,2,x,y-18,24); gg.addColorStop(0,`rgba(${acc},${.45+.15*pulse})`); gg.addColorStop(1,`rgba(${acc},0)`);
    ctx.fillStyle = gg; ctx.fillRect(x-24,y-44,48,48);
    ctx.strokeStyle = `rgba(${acc},.85)`; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(x-12,y); ctx.lineTo(x-12,y-22); ctx.arc(x,y-22,12,Math.PI,0); ctx.lineTo(x+12,y); ctx.stroke();
    ctx.lineWidth = .7; ctx.beginPath(); ctx.moveTo(x-15,y); ctx.lineTo(x-15,y-22); ctx.arc(x,y-22,15,Math.PI,0); ctx.lineTo(x+15,y); ctx.stroke();
    for (let k=0;k<5;k++){ const ph = (time*.5 + k/5) % 1; ctx.fillStyle = `rgba(${acc},${(1-ph)*.8})`; ctx.beginPath(); ctx.arc(x + Math.sin(k*7+time)*6, y - ph*36, .9, 0, 7); ctx.fill(); }
    lights.push({ x:e.x, y:y-18, r:80, a:.95 });
  }
  // plataformas
  const slab = (x, y, w, h, crack) => {
    ctx.fillStyle = p.tile; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = p.rim; ctx.globalAlpha = .85; ctx.fillRect(x, y, w, 1.2); ctx.globalAlpha = .25; ctx.fillRect(x, y+h-1, w, 1); ctx.globalAlpha = 1;
    if (crack){ ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = .6; ctx.beginPath(); ctx.moveTo(x+w*.3,y+1); ctx.lineTo(x+w*.4,y+h); ctx.moveTo(x+w*.7,y+1); ctx.lineTo(x+w*.62,y+h); ctx.stroke(); }
  };
  for (const m of L.movers) if (vis(m.x)){ slab(m.x-camX, m.y, m.w, m.h, false); ctx.strokeStyle = 'rgba(160,170,190,.25)'; ctx.lineWidth = .6; ctx.beginPath(); ctx.moveTo(m.x-camX+6,m.y); ctx.lineTo(m.x-camX+6,0); ctx.moveTo(m.x-camX+m.w-6,m.y); ctx.lineTo(m.x-camX+m.w-6,0); ctx.stroke(); }
  for (const f of L.fallers) if (f.state < 3 && vis(f.x)){ const sh = f.state === 1 ? rnd(-1,1) : 0; slab(f.x-camX+sh, f.y, f.w, f.h, true); }
  // orbes
  for (const o of L.orbs){
    if (o.got || !vis(o.x)) continue;
    const x = o.x - camX, y = o.y + Math.sin(time*2 + o.ph)*2;
    glow(x, y, 9, acc, .5); ctx.fillStyle = '#f4f9ff'; ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 7); ctx.fill();
    lights.push({ x:o.x, y, r:22, a:.7 });
  }
  drawPlayer();
  for (const q of parts){ ctx.fillStyle = `rgba(${q.c},${clamp(q.life/q.max,0,1)})`; ctx.beginPath(); ctx.arc(q.x-camX, q.y, q.r, 0, 7); ctx.fill(); }

  // oscuridad + luces
  if (!P.dead) lights.push({ x:P.lantern.x, y:P.lantern.y, r:105, a:1 }, { x:P.x+P.w/2, y:P.y+8, r:40, a:.6 });
  lctx.setTransform(1,0,0,1,0,0); lctx.globalCompositeOperation = 'source-over'; lctx.clearRect(0,0,lightC.width,lightC.height);
  lctx.fillStyle = `rgba(0,0,0,${p.night})`; lctx.fillRect(0,0,lightC.width,lightC.height);
  lctx.setTransform(R,0,0,R,0,0); lctx.globalCompositeOperation = 'destination-out';
  for (const l of lights){
    const x = l.x - camX; if (x < -l.r || x > VW + l.r) continue;
    const g = lctx.createRadialGradient(x,l.y,0,x,l.y,l.r); g.addColorStop(0,`rgba(0,0,0,${l.a})`); g.addColorStop(1,'rgba(0,0,0,0)');
    lctx.fillStyle = g; lctx.fillRect(x-l.r, l.y-l.r, l.r*2, l.r*2);
  }
  ctx.drawImage(lightC, 0, 0, VW, VH);
  if (!P.dead){ ctx.globalCompositeOperation = 'lighter'; glow(P.lantern.x - camX, P.lantern.y, 34, '255,180,100', .16*P.alpha); ctx.globalCompositeOperation = 'source-over'; }

  // partículas ambientales y lluvia
  for (const m of motes){ ctx.fillStyle = `rgba(${mote},${.25 + .3*Math.sin(time*1.5+m.ph)**2})`; ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 7); ctx.fill(); }
  if (rain.length){
    ctx.strokeStyle = 'rgba(190,198,255,.28)'; ctx.lineWidth = .6; ctx.beginPath();
    for (const d of rain){ ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l*.25, d.y + d.l); }
    ctx.stroke();
  }
  // HUD
  ctx.font = '600 7.5px Cinzel, serif'; ctx.fillStyle = 'rgba(225,233,245,.55)';
  ctx.textAlign = 'left'; ctx.fillText(PHASES[phase].name.toUpperCase(), 10, 15);
  ctx.textAlign = 'right'; ctx.fillText('✦ ' + got + ' / ' + L.orbs.length, VW - 46, 15);
  // fundido
  if (fade > .001){ ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0,0,VW,VH); }
}

function ambient(dt){
  const dc = camX - lastCam; lastCam = camX;
  for (const m of motes){ m.y -= m.v*dt; m.x += Math.sin(time*.8 + m.ph)*5*dt - dc*.3; if (m.y < -4){ m.y = VH+4; m.x = rnd(0,VW); } if (m.x < -5) m.x += VW+10; if (m.x > VW+5) m.x -= VW+10; }
  for (const d of rain){ d.y += d.v*dt; d.x -= d.v*.25*dt + dc*.8; if (d.y > VH){ d.y = rnd(-40,0); d.x = rnd(0,VW+60); } if (d.x < -20) d.x += VW+60; if (d.x > VW+60) d.x -= VW+60; }
}

/* ---------- partículas del menú/poema ---------- */
const sc = $('#souls'), sx = sc.getContext('2d');
let souls = [];
function sizeSouls(){ const d = devicePixelRatio || 1; sc.width = innerWidth*d; sc.height = innerHeight*d; }
sizeSouls(); addEventListener('resize', sizeSouls);
souls = Array.from({length:70}, () => ({ x:Math.random(), y:Math.random(), r:rnd(.6,2.2), v:rnd(.008,.03), ph:rnd(0,6) }));
function drawSouls(dt, t){
  const d = devicePixelRatio || 1, W = sc.width, Hh = sc.height;
  sx.clearRect(0,0,W,Hh);
  for (const s of souls){
    s.y -= s.v*dt; if (s.y < -.05){ s.y = 1.05; s.x = Math.random(); }
    const px = (s.x + Math.sin(t*.3 + s.ph)*.012)*W, py = s.y*Hh, a = .15 + .45*Math.sin(t*.8 + s.ph)**2;
    const g = sx.createRadialGradient(px,py,0,px,py,s.r*d*5); g.addColorStop(0,`rgba(190,215,245,${a*.5})`); g.addColorStop(1,'rgba(190,215,245,0)');
    sx.fillStyle = g; sx.fillRect(px - s.r*d*5, py - s.r*d*5, s.r*d*10, s.r*d*10);
    sx.fillStyle = `rgba(230,240,255,${a})`; sx.beginPath(); sx.arc(px, py, s.r*d*.7, 0, 7); sx.fill();
  }
}

/* ---------- modo fácil: el errante juega solo ----------
   Cada décima de segundo prueba en "su cabeza" varias jugadas cortas (dar un paso,
   saltar, esperar, tomar impulso...). Cada jugada termina parándose al aterrizar.
   Simula cada una con la misma física del juego y elige la que más avanza y
   lo deja de pie a salvo. */
let autoplay = false;
const BOT_DT = 1/120, BOT_MAX = 1.8;
// tramos: [hasta_segundo, derecha, izquierda, mantener_salto]; tap = cuándo pulsa saltar.
// Al acabar los tramos: sigue hacia la derecha mientras está en el aire y se detiene al tocar suelo
// (o se queda quieto del todo si la jugada tiene stop:true).
const PLANS = [
  { n:'esperar',             segs:[[0,0,0,0]] },
  { n:'paso',                segs:[[.15,1,0,0]] },
  { n:'correr corto',        segs:[[.3,1,0,0]] },
  { n:'correr',              segs:[[.6,1,0,0]] },
  { n:'saltar',              segs:[[.6,1,0,1]], tap:0 },
  { n:'salto corto',         segs:[[.12,1,0,1],[.45,1,0,0]], tap:0 },
  { n:'salto con freno',     segs:[[.25,1,0,1],[.6,0,0,1]], tap:0, stop:true },
  { n:'correr y saltar',     segs:[[.15,1,0,0],[.75,1,0,1]], tap:.15 },
  { n:'correr más y saltar', segs:[[.3,1,0,0],[.9,1,0,1]], tap:.3 },
  { n:'saltar en el sitio',  segs:[[.5,0,0,1]], tap:0, stop:true },
  { n:'retroceder',          segs:[[.25,0,1,0]], stop:true },
  { n:'tomar impulso',       segs:[[.22,0,1,0],[.4,1,0,0],[1,1,0,1]], tap:.4 },
  { n:'tomar poco impulso',  segs:[[.12,0,1,0],[.26,1,0,0],[.86,1,0,1]], tap:.26 }
];
const bot = { plan:null, t:0, tapped:false, think:0, bestX:0, stuck:0 };
function botSnap(){
  const on = P.on ? (L.movers.includes(P.on) ? ['m', L.movers.indexOf(P.on)] : ['f', L.fallers.indexOf(P.on)]) : null;
  return { P:{...P}, on, mv:L.movers.map(m => [m.x, m.v, m.dx]), fl:L.fallers.map(f => ({...f})),
    orbs:L.orbs.map(o => o.got), checks:L.checks.map(c => c.on), respawn:{...respawn}, got, state, exitT, lockT,
    time, deadT, fade, fadeTo, parts:parts.map(q => ({...q})), keys:{...keys}, jumpPressed };
}
function botRestore(s){
  Object.assign(P, s.P); P.on = s.on ? (s.on[0] === 'm' ? L.movers[s.on[1]] : L.fallers[s.on[1]]) : null;
  L.movers.forEach((m,i) => { [m.x, m.v, m.dx] = s.mv[i]; });
  L.fallers.forEach((f,i) => Object.assign(f, s.fl[i]));
  L.orbs.forEach((o,i) => o.got = s.orbs[i]); L.checks.forEach((c,i) => c.on = s.checks[i]);
  respawn = s.respawn; got = s.got; state = s.state; exitT = s.exitT; lockT = s.lockT; time = s.time; deadT = s.deadT;
  fade = s.fade; fadeTo = s.fadeTo; parts = s.parts; Object.assign(keys, s.keys); jumpPressed = s.jumpPressed;
}
const planEnd = pl => pl.segs[pl.segs.length-1][0];
function planKeys(pl, t){
  if (t >= planEnd(pl)){ keys.left = false; keys.jump = false; keys.right = !pl.stop && !P.ground; return; }
  const sg = pl.segs.find(x => t < x[0]);
  keys.right = !!sg[1]; keys.left = !!sg[2]; keys.jump = !!sg[3];
}
function botTry(pl){
  const s = botSnap(); SIM = true;
  const x0 = P.x, g0 = got, N = Math.round(BOT_MAX / BOT_DT), tapK = pl.tap === undefined ? -1 : Math.round(pl.tap / BOT_DT);
  const endK = Math.round(planEnd(pl) / BOT_DT);
  let dead = false, exit = false, settled = false, groundK = 0;
  for (let k=0;k<N;k++){
    planKeys(pl, k*BOT_DT); jumpPressed = (k === tapK);
    step(BOT_DT);
    if (P.dead){ dead = true; break; }
    if (state === 'exiting'){ exit = true; break; }
    groundK = P.ground ? groundK + 1 : 0;
    // terminada la jugada, cuando lleva un momento de pie, se da por buena
    if (k >= endK && groundK >= 14 && Math.abs(P.vx) < 20){ settled = true; break; }
  }
  const onFaller = !!(P.on && L.fallers.includes(P.on));
  const r = { dead, exit, settled, onFaller, dx:P.x - x0, orbs:got - g0 };
  botRestore(s); SIM = false;
  return r;
}
function botScore(pl, r){
  if (r.exit) return 1e6;
  if (r.dead) return -1e6 + r.dx;
  return r.dx + r.orbs*12 + (r.settled ? 10 : -40) - (r.onFaller ? 25 : 0) - (pl.tap !== undefined ? 2 : 0);
}
function botUpdate(dt){
  if (state !== 'play' || P.dead || lockT > 0){ keys.left = keys.right = keys.jump = false; bot.plan = null; return; }
  bot.t += dt; bot.think -= dt;
  if (bot.phase !== phase){ bot.phase = phase; bot.bestX = P.x; bot.stuck = 0; }
  // si lleva mucho rato sin avanzar, prueba jugadas distintas; nunca se rinde
  if (P.x > bot.bestX + 8){ bot.bestX = P.x; bot.stuck = 0; } else bot.stuck += dt;
  if (!bot.plan || bot.think <= 0){
    let best = null, bs = -Infinity;
    for (const pl of PLANS){ const sc = botScore(pl, botTry(pl)) + (bot.stuck > 12 ? Math.random()*300 : 0); if (sc > bs){ bs = sc; best = pl; } }
    if (!(best === bot.plan && !P.ground)){ bot.plan = best; bot.t = 0; bot.tapped = false; }
    // si eligió tomar impulso o un salto con retraso, lo termina antes de cambiar de idea
    bot.think = Math.max(.1, (bot.plan.tap || 0) + .05);
  }
  planKeys(bot.plan, bot.t);
  if (bot.plan.tap !== undefined && !bot.tapped && bot.t >= bot.plan.tap){ jumpPressed = true; bot.tapped = true; }
}
function setAutoplay(on){
  autoplay = on;
  keys.left = keys.right = keys.jump = false; bot.plan = null; bot.stuck = 0; bot.bestX = P.x;
  $('#autoBtn').classList.toggle('on', on);
  $('#autoBtn').textContent = on ? '✦ modo fácil: activado' : '✦ modo fácil';
}

/* ---------- bucle principal ---------- */
// la física avanza siempre en pasos fijos de 1/120 s: se juega igual en cualquier pantalla
let physAcc = 0;
function advance(dt){
  physAcc = Math.min(physAcc + dt, .1);
  while (physAcc >= BOT_DT && (state === 'play' || state === 'exiting')){
    if (autoplay) botUpdate(BOT_DT);
    step(BOT_DT); physAcc -= BOT_DT;
  }
}
let last = performance.now(), clock = 0;
function frame(now){
  let dt = Math.min(.05, (now - last)/1000); last = now; clock += dt;
  drawSouls(dt, clock);
  if (state === 'play' || state === 'exiting'){
    advance(dt);
    if (state === 'play' || state === 'exiting'){
      const target = clamp(P.x + P.w/2 - VW/2 + P.face*30, 0, LPX - VW);
      camX += (target - camX) * Math.min(1, dt*4);
      fade += clamp(fadeTo - fade, -dt*1.1, dt*1.1);
      ambient(dt); render();
    }
  }
  updateSubs();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- controles ---------- */
const KMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'jump', KeyW:'jump', Space:'jump', KeyZ:'jump', KeyK:'jump' };
addEventListener('keydown', e => {
  const k = KMAP[e.code];
  if (state === 'menu' && (e.code === 'Enter' || e.code === 'Space')){ e.preventDefault(); start(); return; }
  if (!k) return; e.preventDefault();
  if (k === 'jump' && !keys.jump) jumpPressed = true;
  keys[k] = true;
});
addEventListener('keyup', e => { const k = KMAP[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; });
$$('.pb').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); if (k === 'jump' && !keys.jump) jumpPressed = true; keys[k] = true; b.classList.add('down'); };
  const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('down'); };
  b.addEventListener('pointerdown', on);
  ['pointerup','pointercancel','pointerleave'].forEach(ev => b.addEventListener(ev, off));
  b.addEventListener('contextmenu', e => e.preventDefault());
});

/* ---------- flujo ---------- */
let started = false;
function start(easy = false){
  if (started) return; started = true;
  A();
  song.currentTime = 0; song.play().catch(() => {});
  $('#menu').classList.remove('on');
  setTimeout(() => { $('#stage').classList.add('on'); loadPhase(0); setAutoplay(easy); $('#autoBtn').classList.add('show'); }, 900);
}
$('#startBtn').addEventListener('click', () => start(false));
$('#easyBtn').addEventListener('click', () => start(true));
$('#autoBtn').addEventListener('click', e => { e.currentTarget.blur(); setAutoplay(!autoplay); });

let poemTimer = null;
function toPoem(){
  state = 'poem';
  $('#autoBtn').classList.remove('show');
  $('#stage').classList.remove('on');
  $('.paper-wrap').classList.add('prep');
  $('#poemO').scrollTop = 0;
  setTimeout(() => { $('#poemO').classList.add('on'); unfoldPaper(); }, 1000);
  const box = $('#poem'), doodle = $('#doodle'), DIBUJO_TRAS_LINEA = 3;
  POEMA.forEach((txt, i) => {
    const el = document.createElement('p');
    el.className = 'pline' + (i === POEMA.length-1 ? ' last' : '');
    el.textContent = txt; box.appendChild(el);
    if (i === DIBUJO_TRAS_LINEA - 1) box.appendChild(doodle);
  });
  const lines = $$('#poem .pline'), over = $('#poemO');
  let i = 0;
  const reveal = () => {
    if (i >= lines.length){ clearInterval(poemTimer); return showEnd(); }
    const l = lines[i++]; l.classList.add('show');
    if (i === DIBUJO_TRAS_LINEA) doodle.classList.add('show');
    const r = l.getBoundingClientRect();
    if (r.bottom > innerHeight - 70) over.scrollBy({ top: r.bottom - innerHeight + 150, behavior:'smooth' });
  };
  setTimeout(() => { $('#skip').classList.remove('gone'); reveal(); poemTimer = setInterval(reveal, 2300); }, 4000);
  $('#skip').onclick = () => { clearInterval(poemTimer); lines.forEach(l => l.classList.add('show')); doodle.classList.add('show'); i = lines.length; showEnd(); };
}
/* ---------- papel arrugado que se abre ---------- */
function creaseSVG(seed){
  const r = rng(seed), cols = 8, rows = 12, P = [];
  for (let j=0;j<=rows;j++){ const row = []; for (let i=0;i<=cols;i++){
    const ex = i===0 || i===cols, ey = j===0 || j===rows;
    row.push([i/cols*100 + (ex ? 0 : (r()-.5)*9), j/rows*100 + (ey ? 0 : (r()-.5)*6)]);
  } P.push(row); }
  const f = p => p[0].toFixed(1) + ',' + p[1].toFixed(1);
  let s = '<svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">';
  const tri = (a,b,c) => {
    const fill = r() < .5 ? `rgba(70,50,25,${(.04 + r()*.17).toFixed(3)})` : `rgba(255,255,255,${(.05 + r()*.24).toFixed(3)})`;
    s += `<polygon points="${f(a)} ${f(b)} ${f(c)}" fill="${fill}"/>`;
  };
  for (let j=0;j<rows;j++) for (let i=0;i<cols;i++){
    const a = P[j][i], b = P[j][i+1], c = P[j+1][i+1], d = P[j+1][i];
    if (r() < .5){ tri(a,b,c); tri(a,c,d); } else { tri(a,b,d); tri(b,c,d); }
  }
  for (let k=0;k<12;k++){ const x1=(r()*100).toFixed(1), y1=(r()*100).toFixed(1), x2=(r()*100).toFixed(1), y2=(r()*100).toFixed(1); s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(70,50,25,.45)" stroke-width="1" vector-effect="non-scaling-stroke"/><line x1="${x1}" y1="${+y1+.35}" x2="${x2}" y2="${+y2+.35}" stroke="rgba(255,255,255,.6)" stroke-width="1" vector-effect="non-scaling-stroke"/>`; }
  return s + '</svg>';
}
$$('.face').forEach((face, k) => { const d = document.createElement('div'); d.className = 'creases'; d.innerHTML = creaseSVG(91 + k*17); face.appendChild(d); });

function crinkle(dur = 2){
  if (muted) return; const a = A(); if (!a) return;
  const sr = a.sampleRate, len = Math.floor(sr*dur), buf = a.createBuffer(1, len, sr), d = buf.getChannelData(0);
  let i = 0;
  while (i < len){
    const prog = i/len, burst = Math.floor(sr*rnd(.003,.02)), amp = rnd(.25,1)*(1 - prog*.75);
    for (let k=0;k<burst && i+k<len;k++) d[i+k] = (Math.random()*2-1)*amp*(1 - k/burst);
    i += burst + Math.floor(sr*rnd(.006,.05)*(1 + prog*3));
  }
  const s = a.createBufferSource(); s.buffer = buf;
  const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1700;
  const g = a.createGain(); g.gain.value = .09;
  s.connect(hp); hp.connect(g); g.connect(a.destination); s.start();
}

function unfoldPaper(){
  const wrap = $('.paper-wrap');
  const pts = jag => {
    const out = [], n = 5;
    const edge = (x0,y0,x1,y1) => { for (let k=0;k<n;k++){ const t = k/n; out.push([x0 + (x1-x0)*t, y0 + (y1-y0)*t]); } };
    edge(0,0,100,0); edge(100,0,100,100); edge(100,100,0,100); edge(0,100,0,0);
    return out.map(([x,y]) => { const k = jag ? rnd(jag*.4, jag) : 0; return [x + (50-x)*k + (jag ? rnd(-3,3) : 0), y + (50-y)*k + (jag ? rnd(-3,3) : 0)]; });
  };
  const poly = a => 'polygon(' + a.map(([x,y]) => x.toFixed(1) + '% ' + y.toFixed(1) + '%').join(',') + ')';
  const P = 'perspective(1400px) ';
  wrap.style.transformOrigin = '50% 35%';
  const anim = wrap.animate([
    { offset:0,   opacity:0, transform:P+'translateY(40px) rotate(-30deg) scale(.22)', clipPath:poly(pts(.5)) },
    { offset:.1,  opacity:1 },
    { offset:.36, transform:P+'translateY(12px) rotate(-12deg) scale(.52)', clipPath:poly(pts(.28)) },
    { offset:.6,  transform:P+'rotate(-4deg) rotateX(62deg) scale(.86,.9)', clipPath:poly(pts(.07)) },
    { offset:.82, transform:P+'rotate(-1deg) rotateX(12deg) scale(.99)', clipPath:poly(pts(0)) },
    { offset:1,   opacity:1, transform:P+'rotate(0deg) rotateX(0deg) scale(1)', clipPath:poly(pts(0)) }
  ], { duration:2700, easing:'cubic-bezier(.25,.7,.3,1)', fill:'both' });
  $$('.creases').forEach(c => c.animate([{ opacity:1 }, { opacity:.9, offset:.4 }, { opacity:.42 }], { duration:2700, easing:'ease-in', fill:'both' }));
  wrap.classList.remove('prep');
  crinkle(2.1);
  // al terminar se quita el recorte para que la hoja se pueda voltear en 3D
  anim.onfinish = () => { anim.cancel(); wrap.style.transformOrigin = ''; };
}

function flipPaper(){
  const p = $('#paper'), back = p.classList.toggle('flipped');
  $('#flipBtn span').textContent = back ? 'Ver el poema' : 'Voltear la hoja';
  tone(back ? 660 : 523.3, .6, .03);
  setTimeout(() => p.scrollIntoView({ behavior:'smooth', block:'center' }), 150);
}
$('#flipBtn').onclick = flipPaper;
$('#paper').addEventListener('click', () => { if ($('#fin').classList.contains('show')) flipPaper(); });
function showEnd(){
  $('#skip').classList.add('gone');
  setTimeout(() => $('#sign').classList.add('show'), 700);
  setTimeout(() => {
    $('#fin').classList.add('show'); $('#paper').classList.add('can-flip');
    const f = $('#fin').getBoundingClientRect();
    if (f.bottom > innerHeight) $('#poemO').scrollBy({ top: f.bottom - innerHeight + 40, behavior:'smooth' });
  }, 2000);
}
$('#again').onclick = () => location.reload();
</script>
